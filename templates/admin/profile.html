{% extends "base.html" %}

{% block title %}Admin Profile & Credentials | Admin Panel{% endblock %}

{% block content %}
<div class="container" style="max-width:650px;">
  <div class="form-card">
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; border-bottom:1px solid var(--neutral-200); padding-bottom:16px;">
      <div>
        <h2 style="font-family:var(--font-heading); font-size:1.8rem; color:var(--neutral-900);">
          <i class="fas fa-user-gear" style="color:var(--primary-600);"></i> Admin Profile Settings
        </h2>
        <p style="font-size:0.875rem; color:var(--neutral-500); margin-top:4px;">Change your administrator username, email, and password</p>
      </div>

      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-sm btn-secondary">
        <i class="fas fa-arrow-left"></i> Dashboard
      </a>
    </div>

    <form action="{{ url_for('admin.profile') }}" method="POST">
      
      <!-- Current Username -->
      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label" for="username">Administrator Username <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control" value="{{ admin.username }}" required>
      </div>

      <!-- Email -->
      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ admin.email or '' }}" placeholder="admin@college.edu">
      </div>

      <div style="background:var(--primary-50); border:1px solid var(--primary-200); padding:16px; border-radius:var(--radius-md); margin-bottom:24px;">
        <h4 style="font-family:var(--font-heading); color:var(--primary-900); font-size:0.95rem; margin-bottom:12px;">
          <i class="fas fa-key"></i> Security Verification &amp; Password Update
        </h4>

        <!-- Current Password Required -->
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label" for="current_password">Current Password <span class="required">*</span></label>
          <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter current password to verify identity" required>
        </div>

        <!-- New Password Optional -->
        <div class="form-group">
          <label class="form-label" for="new_password">New Password (Leave blank to keep unchanged)</label>
          <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Enter new password">
        </div>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-reset">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save"></i> Save Profile Changes
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
