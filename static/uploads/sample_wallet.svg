<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fef3c7"/>
  <g transform="translate(110, 60)">
    <!-- Wallet Body -->
    <rect x="0" y="20" width="180" height="130" rx="14" fill="#78350f"/>
    <!-- Flap shadow & texture -->
    <path d="M 0,20 C 60,40 120,40 180,20 L 180,80 Q 90,110 0,80 Z" fill="#92400e"/>
    <!-- ID Card peeking out -->
    <g transform="translate(20, -10)">
      <rect x="0" y="0" width="120" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="10" y="10" width="30" height="40" fill="#2563eb" rx="2"/>
      <rect x="50" y="15" width="55" height="6" fill="#64748b"/>
      <rect x="50" y="27" width="40" height="5" fill="#94a3b8"/>
      <rect x="50" y="38" width="50" height="5" fill="#94a3b8"/>
      <text x="60" y="58" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a">COLLEGE ID</text>
    </g>
    <!-- Metal Clasp -->
    <circle cx="160" cy="85" r="10" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  </g>
</svg>
