<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0fdf4"/>
  <g transform="translate(100, 50)">
    <!-- Case -->
    <rect x="0" y="0" width="200" height="180" rx="12" fill="#0284c7"/>
    <rect x="10" y="10" width="180" height="160" rx="8" fill="#e0f2fe"/>
    <!-- Compass -->
    <path d="M 60,30 L 90,130 M 60,30 L 30,130" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="30" r="10" fill="#0f172a"/>
    <!-- Scale Ruler -->
    <rect x="110" y="30" width="20" height="120" fill="#ffffff" stroke="#94a3b8"/>
    <line x1="110" y1="40" x2="118" y2="40" stroke="#000000"/>
    <line x1="110" y1="50" x2="122" y2="50" stroke="#000000"/>
    <line x1="110" y1="60" x2="118" y2="60" stroke="#000000"/>
    <line x1="110" y1="70" x2="122" y2="70" stroke="#000000"/>
    <line x1="110" y1="80" x2="118" y2="80" stroke="#000000"/>
    <line x1="110" y1="90" x2="122" y2="90" stroke="#000000"/>
    <!-- Protractor -->
    <path d="M 140,120 A 40,40 0 0,0 140,40 Z" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>
</svg>
