<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc"/>
  <g transform="translate(130, 40)">
    <!-- Calculator Body -->
    <rect x="0" y="0" width="140" height="220" rx="12" fill="#1e293b"/>
    <!-- Screen -->
    <rect x="15" y="18" width="110" height="40" rx="4" fill="#84cc16"/>
    <text x="115" y="45" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#1a2e05" text-anchor="end">3.14159265</text>
    <!-- Solar panel -->
    <rect x="15" y="65" width="40" height="15" fill="#451a03"/>
    <!-- Buttons -->
    <g fill="#475569">
      <rect x="15" y="90" width="22" height="16" rx="2"/>
      <rect x="44" y="90" width="22" height="16" rx="2"/>
      <rect x="73" y="90" width="22" height="16" rx="2"/>
      <rect x="102" y="90" width="22" height="16" rx="2" fill="#ef4444"/>
      
      <rect x="15" y="115" width="22" height="16" rx="2"/>
      <rect x="44" y="115" width="22" height="16" rx="2"/>
      <rect x="73" y="115" width="22" height="16" rx="2"/>
      <rect x="102" y="115" width="22" height="16" rx="2" fill="#3b82f6"/>

      <rect x="15" y="140" width="22" height="16" rx="2"/>
      <rect x="44" y="140" width="22" height="16" rx="2"/>
      <rect x="73" y="140" width="22" height="16" rx="2"/>
      <rect x="102" y="140" width="22" height="16" rx="2" fill="#3b82f6"/>

      <rect x="15" y="165" width="22" height="16" rx="2"/>
      <rect x="44" y="165" width="22" height="16" rx="2"/>
      <rect x="73" y="165" width="22" height="16" rx="2"/>
      <rect x="102" y="165" width="22" height="41" rx="2" fill="#22c55e"/>
      
      <rect x="15" y="190" width="51" height="16" rx="2"/>
      <rect x="73" y="190" width="22" height="16" rx="2"/>
    </g>
  </g>
</svg>
